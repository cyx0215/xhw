# 书籍元信息 —— 复制到 books/<书名>/book.toml 后按需修改。
# 所有字段都可省略，省略时用括号里的默认值。
# 改完在工作区根目录跑 `python build.py` 重新生成。

# 书名（默认取目录名）
title = "书名"

# 副标题，显示在封面书名下方，如「第一卷」（默认空）
subtitle = ""

# 一句话简介，显示在书架卡片上（默认空）
tagline = ""

# 封面题引，支持 <br> 换行（默认空）
epigraph = ""

# 连载中 | 已完结（默认「连载中」）
status = "连载中"

# 是否在书架卡片显示「成人向」角标（默认 false）
adult = false

# 该书主色，书架卡片与阅读页共用（默认 "#8c6f4a" 暖棕金）
accent = "#8c6f4a"

# 封面图，相对本书目录的路径；留空则用主色生成式封面（默认空）
cover = ""

# 书架排序，小的在前（默认 99）
order = 99

# 整本导出：epub+txt（默认）/ epub / txt / none
# 产物在 site/<书名>.epub 与 .txt，书架卡片上有下载角标
export = "epub+txt"

# ---- 双线书专用（单线书全部省略即可）----
# 有同章多版本（如 ch014-刀版.md / ch014-美版.md）时，阅读页会出现选线卡。

# 分叉名称，显示在选线卡与目录（默认「双线」）
fork_label = ""
# 选线卡说明文字（默认通用文案）
fork_desc = ""
# 每条线的一句话简介，写法：line_note_<线key>，key 取文件名标签
# （-刀版 → dao，-美版 → mei；默认空）
line_note_mei = ""
line_note_dao = ""
